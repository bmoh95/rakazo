name: release-android-apk

on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - ".github/workflows/release-android-apk.yml"
      - "packages/**"
      - "pnpm-lock.yaml"

permissions:
  contents: read

concurrency:
  group: release-android-apk
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish the Android APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: write
    env:
      RELEASE_TAG: android
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Local Gradle build. The upstream job needed an Expo token and Firebase file
      # variable that a fork does not have. Prebuild stays off the EAS production
      # profile, so EXPO_PUBLIC_API_URL is chosen in the app at sign-in.
      - name: Prebuild the Android project
        working-directory: apps/mobile
        run: pnpm exec expo prebuild --platform android --non-interactive --no-install

      - name: Assemble a signed release APK
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          apk="$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "Gradle did not produce an APK." >&2
            exit 1
          fi
          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort | tail -n 1)"
          if ! "${apksigner}" verify "${apk}" >/dev/null 2>&1; then
            keytool -genkeypair -v \
              -keystore app/release.keystore \
              -alias rakazo \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass rakazo-ci -keypass rakazo-ci \
              -dname "CN=Rakazo, OU=bmoh95, O=bmoh95, C=KR"
            "${apksigner}" sign \
              --ks app/release.keystore \
              --ks-key-alias rakazo \
              --ks-pass pass:rakazo-ci \
              --key-pass pass:rakazo-ci \
              "${apk}"
            "${apksigner}" verify "${apk}"
          fi

      - name: Collect the APK
        id: build
        run: |
          set -euo pipefail
          apk="$(find apps/mobile/android/app/build/outputs/apk -name '*.apk' -type f | head -n 1)"
          if [[ -z "${apk}" ]]; then
            echo "Gradle did not produce an APK." >&2
            find apps/mobile/android -name '*.apk' -o -name '*.aab' || true
            exit 1
          fi
          cp "${apk}" "${RUNNER_TEMP}/rakazo.apk"
          if [[ "$(head -c 2 "${RUNNER_TEMP}/rakazo.apk")" != "PK" ]]; then
            echo "The artifact is not an APK." >&2
            exit 1
          fi
          version="$(node -p "require('./apps/mobile/app.json').expo.version")"
          version_code="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "version_code=${version_code}" >> "${GITHUB_OUTPUT}"

      # One rolling release keeps a stable download URL:
      # https://github.com/<owner>/<repo>/releases/download/android/rakazo.apk
      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.build.outputs.version }}
          VERSION_CODE: ${{ steps.build.outputs.version_code }}
        run: |
          set -euo pipefail
          title="Rakazo for Android ${VERSION} (${VERSION_CODE})"
          notes=$'Install rakazo.apk on your Android phone.\n\nThis build includes Korean. On a Korean device the app opens in Korean. Otherwise choose Korean in Settings, then Language.\n\nThe server is selected on the sign-in screen, so this APK can talk to a self-hosted Rakazo server. Push notifications need a Firebase google-services.json, which this fork build does not include.'
          if ! gh release view "${RELEASE_TAG}" --json tagName > /dev/null 2> "${RUNNER_TEMP}/view.err"; then
            if ! grep -q "release not found" "${RUNNER_TEMP}/view.err"; then
              cat "${RUNNER_TEMP}/view.err" >&2
              exit 1
            fi
            gh release create "${RELEASE_TAG}" "${RUNNER_TEMP}/rakazo.apk" \
              --target "${GITHUB_SHA}" \
              --title "${title}" \
              --notes "${notes}" \
              --latest=false
            exit 0
          fi

          staged="rakazo-${VERSION_CODE}.apk"
          cp "${RUNNER_TEMP}/rakazo.apk" "${RUNNER_TEMP}/${staged}"
          gh release upload "${RELEASE_TAG}" "${RUNNER_TEMP}/${staged}" --clobber
          assets="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" --jq '.assets')"
          staged_id="$(jq -r --arg name "${staged}" '.[] | select(.name == $name) | .id' <<< "${assets}")"
          old_id="$(jq -r '.[] | select(.name == "rakazo.apk") | .id' <<< "${assets}")"
          if [[ -z "${staged_id}" ]]; then
            echo "The uploaded ${staged} is missing from the release; leaving the previous APK in place." >&2
            exit 1
          fi
          if [[ -n "${old_id}" ]]; then
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${old_id}"
          fi
          for attempt in 1 2 3; do
            if gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/assets/${staged_id}" -f name=rakazo.apk > /dev/null; then
              break
            fi
            if [[ "${attempt}" == 3 ]]; then
              echo "Could not rename ${staged} to rakazo.apk; rename it on the release page." >&2
              exit 1
            fi
            sleep 5
          done
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" -f sha="${GITHUB_SHA}" -F force=true > /dev/null
          gh release edit "${RELEASE_TAG}" --title "${title}" --notes "${notes}" --latest=false
